name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build API and referenced libraries
        run: dotnet build Api/MyPortfolio.Api.csproj --configuration Release
      - name: Build Blazor
        run: dotnet build MyPortfolio/MyPortfolio.web.csproj --configuration Release
      - name: Build SQL database with Visual Studio SSDT
        run: msbuild Database/MyPortfolio.Database.sqlproj /p:Configuration=Release /p:Platform=AnyCPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: dotnet dev-certs https
      - run: python scripts/smoke-test.py
